<!doctype html>
<html lang="tr">
  <head>
    <meta charset="UTF-8" />
    <!-- ⚠ `viewport-fit=cover` is load-bearing, not a flourish (2026-09-19). Without it iOS keeps
         the layout viewport inside the notch and the home indicator, and EVERY `env(safe-area-inset-*)`
         in the stylesheet resolves to 0px — the six written for the phone bottom bar on 2026-09-11 all
         did. With it the page owns the whole screen and the insets become real numbers, so anything
         fixed to an edge has to ask for them: `.kv-page` pads by them, and so do the bottom bars. -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <title>KomaVision — nota fotoğrafını sese çevirir</title>
    <meta
      name="description"
      content="Türk müziği notasının fotoğrafını okur, notaya dizer ve 53 komalı sesiyle çalar."
    />
    <!-- The browser chrome takes the page's ground: ivory by day, the night page's slate in dark mode
         (tokens.css --paper). src/theme.ts rewrites both once the reader flips the switch. -->
    <meta name="theme-color" content="#f7f4ec" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#12151f" media="(prefers-color-scheme: dark)" />
    <!-- ⚠ THE THEME IS DECIDED HERE, BEFORE THE FIRST PAINT (2026-10-01). Deciding it in React would
         flash the light page on every dark visit. The rule is src/theme.ts's `resolveTheme` and the
         two must agree: a render job (`?mode=`) is always light; otherwise the reader's stored
         choice (`kv.theme`), else the system. Storage can THROW (private windows) — hence the try. -->
    <script>
      (function () {
        var t = "light";
        try {
          if (!new URLSearchParams(location.search).has("mode")) {
            var v = localStorage.getItem("kv.theme");
            t = v === "light" || v === "dark" ? v : matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light";
          }
        } catch (e) {}
        document.documentElement.dataset.theme = t;
      })();
    </script>
    <!-- ⭐ INSTALLABLE (2026-09-28): the manifest is what lets Android Chrome offer "Uygulamayı yükle"
         and what a Play Store TWA is built from later; the apple-* tags are iOS's own "Ana Ekrana
         Ekle". ⚠ `.webmanifest`, NOT `manifest.json`: `tools/prune-dist.mjs` fails the build on any
         .json at the dist root, because that is where a copyrighted score would land.
         ⚠ No service worker, on purpose: Chrome no longer requires one to install, and a caching
         worker is the classic way to keep serving the OLD app after a deploy. The icons are
         generated by `tools/browser/make-icons.ts` from this page's favicon. -->
    <link rel="manifest" href="/manifest.webmanifest" />
    <link rel="apple-touch-icon" href="/icons/apple-touch-icon.png" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-title" content="KomaVision" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <!-- Inline SVG favicon: a koma diyezi, gold and ivory on lapis (Tezhip, 2026-09-30). No file to ship, no request to make, and
         nothing for the build's "weights must not enter dist/" check to trip over. -->
    <link
      rel="icon"
      href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='6' fill='%231f3a6b'/%3E%3Cg stroke='%23d4af5f' stroke-width='2.4' stroke-linecap='round'%3E%3Cpath d='M11 6v20M21 6v20'/%3E%3C/g%3E%3Cg stroke='%23f7f4ec' stroke-width='2.6' stroke-linecap='round'%3E%3Cpath d='M7 13.5l18-3.2M7 21.7l18-3.2'/%3E%3C/g%3E%3C/svg%3E"
    />
  </head>
  <body>
    <!-- The night sheet's ink (2026-10-01; styles/contract.css). ONE colour for every mark however it
         was drawn: black ink, a grey time signature and an antialiased hairline all come out as the
         same soft neutral grey rgb(200,200,200), scaled by how dark they were — a CSS `sepia()` chain
         had tinted the grey glyphs far yellower than the black ones, and the owner wants no tint. Unused until dark mode. -->
    <svg width="0" height="0" aria-hidden="true" focusable="false" style="position: absolute">
      <filter id="kv-night-ink" color-interpolation-filters="sRGB">
        <feColorMatrix type="matrix" values="-0.1667 -0.5609 -0.0566 0 0.7843  -0.1667 -0.5609 -0.0566 0 0.7843  -0.1667 -0.5609 -0.0566 0 0.7843  0 0 0 1 0" />
      </filter>
    </svg>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
